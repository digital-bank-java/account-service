spring.application.name=account-service
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

spring.kafka.bootstrap-servers=${ACCOUNT_LEDGER_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest

account.ledger.kafka.enabled=${ACCOUNT_LEDGER_KAFKA_ENABLED:false}
account.ledger.kafka.completed-topic=${ACCOUNT_LEDGER_KAFKA_COMPLETED_TOPIC:ledger.posting.completed.v1}
account.ledger.kafka.failed-topic=${ACCOUNT_LEDGER_KAFKA_FAILED_TOPIC:ledger.posting.failed.v1}
account.ledger.kafka.group-id=${ACCOUNT_LEDGER_KAFKA_GROUP_ID:account-service-ledger-outcomes-v1}
account.ledger.kafka.retry-attempts=${ACCOUNT_LEDGER_KAFKA_RETRY_ATTEMPTS:3}
account.ledger.kafka.retry-delay-ms=${ACCOUNT_LEDGER_KAFKA_RETRY_DELAY_MS:1000}
