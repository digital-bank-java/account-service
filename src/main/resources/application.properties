spring.application.name=account-service
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

spring.kafka.bootstrap-servers=${ACCOUNT_LEDGER_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.properties[security.protocol]=${ACCOUNT_LEDGER_KAFKA_SECURITY_PROTOCOL:SASL_SSL}

account.ledger.kafka.enabled=${ACCOUNT_LEDGER_KAFKA_ENABLED:false}
account.ledger.kafka.allow-insecure-transport=${ACCOUNT_LEDGER_KAFKA_ALLOW_INSECURE_TRANSPORT:false}
account.ledger.kafka.auto-startup=${ACCOUNT_LEDGER_KAFKA_AUTO_STARTUP:true}
account.ledger.kafka.completed-topic=${ACCOUNT_LEDGER_KAFKA_COMPLETED_TOPIC:ledger.posting.completed.v1}
account.ledger.kafka.failed-topic=${ACCOUNT_LEDGER_KAFKA_FAILED_TOPIC:ledger.posting.failed.v1}
account.ledger.kafka.group-id=${ACCOUNT_LEDGER_KAFKA_GROUP_ID:account-service-ledger-outcomes-v1}
account.ledger.kafka.retry-attempts=${ACCOUNT_LEDGER_KAFKA_RETRY_ATTEMPTS:3}
account.ledger.kafka.retry-delay-ms=${ACCOUNT_LEDGER_KAFKA_RETRY_DELAY_MS:1000}

account.reservation.expiry.enabled=${ACCOUNT_RESERVATION_EXPIRY_ENABLED:true}
account.reservation.expiry.batch-size=${ACCOUNT_RESERVATION_EXPIRY_BATCH_SIZE:100}
account.reservation.expiry.sweep-delay-ms=${ACCOUNT_RESERVATION_EXPIRY_SWEEP_DELAY_MS:30000}
account.reservation.expiry.initial-delay-ms=${ACCOUNT_RESERVATION_EXPIRY_INITIAL_DELAY_MS:30000}
