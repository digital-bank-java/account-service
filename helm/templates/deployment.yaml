apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "account-service.fullname" . }}
  labels:
    {{- include "account-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  minReadySeconds: 5
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "account-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "account-service.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: {{ include "account-service.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CONFIG_SERVER_URL
              value: {{ .Values.runtime.configServerUrl | quote }}
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.runtime.profile | quote }}
            - name: ACCOUNT_LEDGER_KAFKA_ENABLED
              value: {{ .Values.ledgerKafka.enabled | quote }}
            - name: ACCOUNT_LEDGER_KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.ledgerKafka.bootstrapServers | quote }}
            - name: ACCOUNT_LEDGER_KAFKA_COMPLETED_TOPIC
              value: {{ .Values.ledgerKafka.completedTopic | quote }}
            - name: ACCOUNT_LEDGER_KAFKA_FAILED_TOPIC
              value: {{ .Values.ledgerKafka.failedTopic | quote }}
            - name: ACCOUNT_LEDGER_KAFKA_GROUP_ID
              value: {{ .Values.ledgerKafka.groupId | quote }}
            - name: ACCOUNT_LEDGER_KAFKA_RETRY_ATTEMPTS
              value: {{ .Values.ledgerKafka.retryAttempts | quote }}
            - name: ACCOUNT_LEDGER_KAFKA_RETRY_DELAY_MS
              value: {{ .Values.ledgerKafka.retryDelayMs | quote }}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName | quote }}
                  key: {{ .Values.database.usernameKey | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName | quote }}
                  key: {{ .Values.database.passwordKey | quote }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.temporaryStorage.sizeLimit }}
